html, body { margin: 0; height: 100%; overflow: hidden; background: #E9E2DA; -webkit-text-size-adjust: 100%; }
#stage { position: fixed; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
#device { flex: none; width: 390px; height: var(--app-h, 844px); overflow: hidden; transform: scale(var(--s, 1)); -webkit-user-select: none; user-select: none; }
#web { position: fixed; left: 0; right: 0; top: 0; bottom: 0; display: none; }
.webmode #stage { display: none; }
.webmode #web { display: block; }
.desk #device { border-radius: 44px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28); }
.phone #stage { display: block; }
.phone #device { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#toWeb { position: fixed; right: 20px; top: 20px; display: none; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: #2B1519; color: #FFFFFF; font: 700 15px 'Atkinson Hyperlegible', sans-serif; cursor: pointer; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); }
button { -webkit-appearance: none; appearance: none; margin: 0; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="stage"><div id="device"></div></div>
<div id="web"></div>
<button type="button" id="toWeb"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>Zur Web-Ansicht</button>
<template id="tpl-app">
<div style="width: 390px; height: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: 'Atkinson Hyperlegible', sans-serif; background: {{c.bg}}; color: {{c.ink}}">

<sc-if value="{{is.main}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px">
  <div style="display: flex; align-items: center; gap: 8px">
    <span style="width: 34px; height: 34px; border-radius: 17px; background: {{c.primary}}; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{is.wein}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.onPrimary}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l-.6 5.5a4.4 4.4 0 0 1-8.8 0z"></path><path d="M12 13v8"></path><path d="M8 21h8"></path></svg></sc-if>
      <sc-if value="{{is.bier}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.onPrimary}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h10v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"></path><path d="M15 11h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"></path><path d="M5 8a3 3 0 0 1 5-2 3 3 0 0 1 5 2"></path></svg></sc-if>
    </span>
    <span style="font-weight: 700; font-size: 15px">[App-Name]</span>
  </div>
  <div role="group" aria-label="Wein oder Bier" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; width: 150px; padding: 3px; border-radius: 14px; background: {{c.seg}}">
    <button type="button" aria-pressed="{{pressWein}}" onClick="{{toWein}}" style="font: inherit; font-size: 15px; height: 38px; border: 0; border-radius: 11px; cursor: pointer; {{segWein}}">Wein</button>
    <button type="button" aria-pressed="{{pressBier}}" onClick="{{toBier}}" style="font: inherit; font-size: 15px; height: 38px; border: 0; border-radius: 11px; cursor: pointer; {{segBier}}">Bier</button>
  </div>
</div>
</sc-if>

<sc-if value="{{is.welcome}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column">
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center">
    <div style="display: flex; gap: 10px">
      <span style="width: 64px; height: 64px; border-radius: 32px; background: {{cw.primary}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l-.6 5.5a4.4 4.4 0 0 1-8.8 0z"></path><path d="M12 13v8"></path><path d="M8 21h8"></path></svg></span>
      <span style="width: 64px; height: 64px; border-radius: 32px; background: {{cb.primary}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h10v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"></path><path d="M15 11h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"></path><path d="M5 8a3 3 0 0 1 5-2 3 3 0 0 1 5 2"></path></svg></span>
    </div>
    <span style="margin-top: 24px; font-size: 15px; font-weight: 700; color: {{c.muted}}">[App-Name]</span>

      <div style="display: flex; align-items: center; gap: 12px"><span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: {{c.soft}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg></span><span style="font-size: 16px; font-weight: 700">Geführtes Tasting zum Mitmachen</span></div>

    </div>
  </div>
  <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; line-height: 20px"><input type="checkbox" checked="{{s.ageOk}}" onChange="{{toggleAge}}" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: {{c.primary}}">Ich bin mindestens 18 Jahre alt.</label>

<sc-if value="{{is.home}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 4px 20px 20px">

    <button type="button" onClick="{{openQuick}}" style="font: inherit; text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 16px; min-height: 116px; border-radius: 20px; border: 1.5px solid {{c.border}}; background: {{c.surface}}; color: {{c.ink}}; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg><span style="margin-top: auto; font-weight: 700; font-size: 18px">Schnell notieren</span><span style="font-size: 13px; line-height: 17px; color: {{c.muted}}">Foto, Sterne, fertig</span></button>
  </div>
  <sc-if value="{{is.free}}" hint-placeholder-val="{{ true }}">
  <button type="button" onClick="{{openPay}}" style="margin-top: 10px; width: 100%; font: inherit; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1.5px dashed {{c.primary}}; background: {{c.soft}}; color: {{c.ink}}; cursor: pointer"><span style="font-size: 14px; text-align: left">Ohne Werbung, mit Cloud und Web-Ansicht</span><span style="flex: none; font-weight: 700; font-size: 14px; color: {{c.primaryText}}">Premium holen</span></button>

  </div>

  <h2 style="margin: 22px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: {{c.muted}}">Lern-Häppchen</h2>

  </div>

      <button type="button" onClick="{{snap}}" style="margin-top: 14px; width: 100%; font: inherit; height: 168px; border-radius: 20px; border: 2px dashed {{c.border}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg><span style="font-weight: 700; font-size: 16px">Etikett fotografieren (Vorschau)</span><span style="font-size: 13px; color: {{c.muted}}">Die App liest Name und Jahrgang vom Etikett</span></button>

        <span style="font-size: 13px; font-weight: 700; color: {{c.primaryText}}">Erkannt</span>
        <div style="margin-top: 6px; display: flex; align-items: center; gap: 12px">
          <span style="flex: none; width: 52px; height: 64px; border-radius: 12px; background: {{c.seg}}; display: flex; align-items: flex-end; justify-content: center"><svg aria-hidden="true" width="32" height="54" viewBox="0 0 60 100"><path d="{{bottlePath}}" fill="{{snapB.hex}}"></path></svg></span>
          <span style="display: flex; flex-direction: column"><span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px">{{snapB.name}}</span><span style="font-size: 14px; color: {{c.muted}}">{{snapB.maker}} · {{snapB.meta}}</span></span>

          <button type="button" onClick="{{unsnap}}" style="font: inherit; font-size: 15px; height: 48px; padding: 0 16px; border-radius: 24px; border: 1.5px solid {{c.border}}; background: transparent; color: {{c.ink}}; cursor: pointer">Doch nicht</button>

      <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px">

          <span style="flex: none; width: 44px; height: 52px; border-radius: 10px; background: {{c.seg}}; display: flex; align-items: flex-end; justify-content: center"><svg aria-hidden="true" width="26" height="44" viewBox="0 0 60 100"><path d="{{bottlePath}}" fill="{{b.hex}}"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">{{b.name}}</span><span style="font-size: 13px; color: {{c.muted}}">{{b.maker}} · {{b.meta}}</span></span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>

    <sc-if value="{{is.tabRec}}" hint-placeholder-val="{{ false }}">

<sc-if value="{{is.step}}" hint-placeholder-val="{{ false }}">

  <div style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 0">
    <button type="button" aria-label="Zurück" onClick="{{prevStep}}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: {{c.surface}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>

    <button type="button" aria-label="{{speakLabel}}" aria-pressed="{{pressSpeak}}" onClick="{{toggleSpeak}}" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; {{speakSt}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{speakInk}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg></button>

  <div style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 12px 20px 0">

  <div role="group" aria-label="Tasting-Stil" style="flex: none; margin: 10px 20px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: {{c.seg}}">
    <sc-for list="{{tsSeg}}" as="o" hint-placeholder-count="4"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="font: inherit; font-size: 13px; height: 34px; border: 0; border-radius: 9px; cursor: pointer; {{o.st}}">{{o.label}}</button></sc-for>
  </div>
  <div style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 14px 20px 16px">

    <sc-if value="{{ts.small}}" hint-placeholder-val="{{ true }}">

    <button type="button" onClick="{{pStart}}" style="margin-top: 16px; width: 100%; font: inherit; font-weight: 700; font-size: 17px; height: 54px; border: 0; border-radius: 27px; background: {{c.primary}}; color: {{c.onPrimary}}; cursor: pointer">Abend starten</button>
