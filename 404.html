    <script>
      // Vor dem Laden: Hintergrund in der gespeicherten Darstellung, damit nichts weiß aufblitzt.
      (function () {
        var dunkel = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        try { var e = JSON.parse(localStorage.getItem('tastingpath.einstellung') || '{}'); if (e.darstellung === 'dunkel') dunkel = true; if (e.darstellung === 'hell') dunkel = false; } catch (x) {}
        var bg = dunkel ? '#000000' : '#F2F3EA';
        document.documentElement.style.backgroundColor = bg;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        // Feste Statusleiste (nicht durchscheinend): Die App beginnt darunter. So legt iOS keine Unschärfe über
        // die Kopfzeile, und die Höhe stimmt (kein Balken unten). Dunkel: schwarze Leiste, hell: helle Leiste.
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', dunkel ? 'black' : 'default');
      })();
    </script>
    <script>
      // Vom Home-Bildschirm gestartet (Vollbild): Adresse nie ändern. Sonst blendet iOS beim Wechsel der Seite
      // wieder die Safari-Leiste ein. Die App merkt sich die Seiten intern, Zurück funktioniert weiter.
      (function () {
        var vollbild = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (!vollbild) return;
        var fest = window.location.href;
        var push = history.pushState.bind(history);
        var ersetze = history.replaceState.bind(history);
        history.pushState = function (zustand, titel) { return push(zustand, titel, fest); };
        history.replaceState = function (zustand, titel) { return ersetze(zustand, titel, fest); };
      })();
    </script>
    <script>
      // Falls ein Programmteil nicht geladen werden kann (z. B. alte, zwischengespeicherte Version nach einem Update):
      // Seite einmal neu laden statt einer weißen Seite.
      (function () {
        var KEY = 'tastingpath.neugeladen';
        function neu() {
          try {
            var zuletzt = Number(sessionStorage.getItem(KEY) || 0);
            if (Date.now() - zuletzt < 15000) return;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (x) {}
          window.location.reload();
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT') neu();
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var m = String((e && e.reason && (e.reason.message || e.reason)) || '');
          if (/load|chunk|fetch|import|module/i.test(m)) neu();
        });
      })();
    </script>
